<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4636"/>
      <stop offset="1" stop-color="#7c5a42"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="0.55" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#f472b6"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="436" rx="150" ry="16" fill="#000000" opacity="0.18"/>

  <!-- trunk + branches -->
  <g stroke="url(#trunk)" stroke-linecap="round" fill="none">
    <path d="M256 432 C 252 360, 250 320, 256 286" stroke-width="26"/>
    <path d="M256 320 C 230 300, 206 286, 178 250" stroke-width="16"/>
    <path d="M256 332 C 286 312, 312 300, 342 262" stroke-width="16"/>
    <path d="M254 300 C 244 280, 232 268, 214 250" stroke-width="11"/>
    <path d="M258 300 C 270 282, 286 272, 304 254" stroke-width="11"/>
  </g>

  <!-- blossom canopy: soft clusters -->
  <g fill="url(#bloom)">
    <circle cx="256" cy="190" r="70"/>
    <circle cx="180" cy="220" r="54"/>
    <circle cx="332" cy="218" r="54"/>
    <circle cx="210" cy="158" r="44"/>
    <circle cx="304" cy="156" r="44"/>
    <circle cx="150" cy="186" r="34"/>
    <circle cx="362" cy="184" r="34"/>
  </g>

  <!-- a few 5-petal blossoms as detail -->
  <g fill="#ffffff" opacity="0.95">
    <g id="flower">
      <circle cx="256" cy="163" r="8"/>
      <circle cx="268" cy="172" r="8"/>
      <circle cx="264" cy="187" r="8"/>
      <circle cx="248" cy="187" r="8"/>
      <circle cx="244" cy="172" r="8"/>
    </g>
    <g transform="translate(186 214) scale(0.8) translate(-256 -176)">
      <circle cx="256" cy="163" r="8"/><circle cx="268" cy="172" r="8"/><circle cx="264" cy="187" r="8"/><circle cx="248" cy="187" r="8"/><circle cx="244" cy="172" r="8"/>
    </g>
    <g transform="translate(330 210) scale(0.8) translate(-256 -176)">
      <circle cx="256" cy="163" r="8"/><circle cx="268" cy="172" r="8"/><circle cx="264" cy="187" r="8"/><circle cx="248" cy="187" r="8"/><circle cx="244" cy="172" r="8"/>
    </g>
  </g>
  <g fill="#f472b6">
    <circle cx="256" cy="176" r="5.5"/>
    <circle cx="186" cy="214" r="4.5"/>
    <circle cx="330" cy="210" r="4.5"/>
  </g>

  <!-- falling petals -->
  <g fill="#f9a8d4">
    <ellipse cx="150" cy="300" rx="9" ry="6" transform="rotate(35 150 300)"/>
    <ellipse cx="372" cy="312" rx="9" ry="6" transform="rotate(-30 372 312)"/>
    <ellipse cx="320" cy="356" rx="8" ry="5" transform="rotate(20 320 356)"/>
    <ellipse cx="196" cy="356" rx="8" ry="5" transform="rotate(-20 196 356)"/>
  </g>
</svg>
