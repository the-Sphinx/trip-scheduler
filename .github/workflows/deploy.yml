name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          VITE_GOOGLE_SHEETS_API_KEY: ${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}
          VITE_GOOGLE_SHEET_ID: ${{ secrets.VITE_GOOGLE_SHEET_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_WRITE_SECRET: ${{ secrets.VITE_WRITE_SECRET }}

      # Password protection temporarily disabled — site is served unencrypted.
      # To re-enable, uncomment this step (it encrypts index.html behind the
      # staticrypt password prompt).
      # - name: Encrypt index.html with staticrypt
      #   run: |
      #     npx -y staticrypt dist/index.html \
      #       -p "$STATICRYPT_PASSWORD" \
      #       --short --remember 30 \
      #       -d dist-encrypted
      #     mv dist/index.html dist/index.html.plain
      #     mv dist-encrypted/index.html dist/index.html
      #     rm -f dist/index.html.plain
      #   env:
      #     STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
